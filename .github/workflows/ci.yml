name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8
      - name: Lint with flake8
        run: |
          flake8 --max-line-length=120 || true
      - name: Run simple smoke (import) test
        run: |
          python - <<'PY'
          import importlib
          import sys
          try:
              import src.prompt_templates
              import src.llm_providers
              import src.utils
              print("imports OK")
          except Exception as e:
              print("Import failed:", e)
              sys.exit(1)
          PY
